{% extends "layouts/entrance.html" %}
{% load i18n accounts %}
{% block title %}{% translate "Lykilorð" %} · Jólahjól{% endblock %}
{% block content %}
  <h1>{% translate "Breyta lykilorði" %}</h1>
  <form method="post" action="{% url 'account_change_password' %}" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    <input type="text" name="email" value="{{ request.user.email }}" autocomplete="username" hidden>
    <c-field :field="form.oldpassword" />
    <c-field :field="form.password1" />
    {{ redirect_field }}
    <button type="submit" class="btn primary block"><span class="ms">key</span>{% translate "Vista lykilorð" %}</button>
  </form>
  <div class="entrance-foot">
    <a href="{% next_url %}">{% translate "Til baka" %}</a>
  </div>
{% endblock %}
