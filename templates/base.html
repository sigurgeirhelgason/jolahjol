{% load static i18n %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Jólahjól{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "historyCacheSize": 0, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="icon" href="{% static 'favicon-32.png' %}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}">
  {% block meta %}{% endblock %}
  <link rel="preload" href="{% static 'fonts/material-symbols.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <script defer src="{% static 'vendor/htmx.min.js' %}"></script>
  <script defer src="{% static 'js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
  <script defer src="{% static 'vendor/alpine-csp.min.js' %}"></script>
</head>
<body{% block body_attrs %}{% endblock %}>
{% block body %}{% endblock %}
</body>
</html>
